<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <meta name="description" content="A little hello from the web.">
  <title>First Git Project</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink:#f5f3ff; --muted:#aca9c5; --aqua:#9af5e2; --violet:#a891ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Manrope,system-ui,sans-serif; background:radial-gradient(ellipse at 50% 38%,#282348 0%,#17172d 38%,#101326 75%); }
    body::before, body::after { content:""; position:fixed; inset:-30%; pointer-events:none; background-image:radial-gradient(1px 1px at 20% 30%,#fff 98%,transparent),radial-gradient(1px 1px at 70% 60%,#b6f6ea 98%,transparent),radial-gradient(2px 2px at 45% 80%,#fff 98%,transparent),radial-gradient(1px 1px at 85% 15%,#d1c4ff 98%,transparent); background-size:173px 191px,229px 211px,307px 277px,251px 263px; opacity:.55; animation:drift 70s linear infinite; }
    body::after { opacity:.25; transform:scale(1.35); animation-duration:110s; animation-direction:reverse; }
    @keyframes drift { to { transform:translate3d(4%, -3%, 0) rotate(5deg); } }
    main { position:relative; z-index:1; width:min(680px, calc(100% - 36px)); padding:clamp(34px,8vw,76px) 24px; text-align:center; }
    nav { position:absolute; z-index:2; top:28px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:6px; border:1px solid rgba(255,255,255,.1); border-radius:999px; background:rgba(18,19,39,.45); backdrop-filter:blur(12px); }
    nav a { padding:9px 14px; border-radius:999px; color:#c7c4db; text-decoration:none; font-size:12px; font-weight:700; transition:background .2s,color .2s; }
    nav a:hover, nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.11); }
    nav a:focus-visible { outline:2px solid var(--aqua); outline-offset:2px; }
    .orb { position:absolute; z-index:-1; top:50%; left:50%; width:min(580px,90vw); aspect-ratio:1; transform:translate(-50%,-53%); border-radius:50%; background:radial-gradient(circle,rgba(128,105,255,.17),rgba(85,225,204,.07) 42%,transparent 69%); filter:blur(12px); }
    .eyebrow { display:inline-flex; align-items:center; gap:10px; color:var(--aqua); font:500 11px 'DM Mono',monospace; letter-spacing:.2em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--aqua); box-shadow:0 0 14px var(--aqua); }
    h1 { margin:24px 0 18px; font-size:clamp(58px,12vw,106px); line-height:.98; letter-spacing:-.075em; font-weight:800; }
    h1 span { color:transparent; background:linear-gradient(110deg,#fff 8%,#c3b5ff 48%,#93efdf 95%); -webkit-background-clip:text; background-clip:text; }
    .subtitle { max-width:420px; margin:0 auto; color:var(--muted); font-size:clamp(15px,2.5vw,18px); line-height:1.8; }
    .actions { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:36px; }
    button { display:inline-flex; align-items:center; gap:10px; border:1px solid rgba(255,255,255,.17); border-radius:999px; padding:13px 19px; color:#131629; background:linear-gradient(110deg,#b8fff0,#c7baff); font:700 13px Manrope,sans-serif; cursor:pointer; box-shadow:0 7px 30px rgba(151,227,216,.16); transition:transform .2s, box-shadow .2s; }
    button:hover { transform:translateY(-2px); box-shadow:0 10px 36px rgba(151,227,216,.3); }
    button:focus-visible { outline:2px solid white; outline-offset:4px; }
    .sparkle { font-size:17px; }
    .note { margin-top:56px; color:#77768f; font:11px 'DM Mono',monospace; letter-spacing:.08em; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <div class="eyebrow">A small page with big energy</div>
    <h1><span>Hi,</span><br>My name is Amilcar!</h1>
    <p class="subtitle">A fresh little corner of the internet.<br>Glad you stopped by.</p>
    <div class="actions">
      <button id="hello" type="button"><span class="sparkle" aria-hidden="true">✦</span><span>Say hello</span></button>
    </div>
    <div class="note">MADE OF PIXELS &amp; POSSIBILITY</div>
  </main>
  <nav aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <script>
    const button = document.querySelector('#hello');
    const label = button.querySelector('span:last-child');
    button.addEventListener('click', () => {
      label.textContent = label.textContent === 'Say hello' ? 'Hello, you! ✨' : 'Say hello';
    });
  </script>
</body>
</html>
