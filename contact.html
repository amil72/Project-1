<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <meta name="description" content="Get in touch. We'd love to hear from you.">
  <title>Contact — Hello, World!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme:dark; --ink:#f5f3ff; --muted:#aca9c5; --aqua:#9af5e2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Manrope,system-ui,sans-serif; background:radial-gradient(ellipse at 50% 38%,#282348 0%,#17172d 38%,#101326 75%); }
    body::before,body::after { content:""; position:fixed; inset:-30%; pointer-events:none; background-image:radial-gradient(1px 1px at 20% 30%,#fff 98%,transparent),radial-gradient(1px 1px at 70% 60%,#b6f6ea 98%,transparent),radial-gradient(2px 2px at 45% 80%,#fff 98%,transparent),radial-gradient(1px 1px at 85% 15%,#d1c4ff 98%,transparent); background-size:173px 191px,229px 211px,307px 277px,251px 263px; opacity:.5; animation:drift 70s linear infinite; }
    @keyframes drift { to { transform:translate3d(4%,-3%,0) rotate(5deg); } }
    nav { position:fixed; z-index:2; top:28px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:6px; border:1px solid rgba(255,255,255,.1); border-radius:999px; background:rgba(18,19,39,.45); backdrop-filter:blur(12px); }
    nav a { padding:9px 14px; border-radius:999px; color:#c7c4db; text-decoration:none; font-size:12px; font-weight:700; transition:background .2s,color .2s; white-space:nowrap; }
    nav a:hover,nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.11); }
    nav a:focus-visible { outline:2px solid var(--aqua); outline-offset:2px; }
    @media (max-width:520px) { nav { gap:2px; padding:5px; } nav a { padding:8px 10px; font-size:11px; } }
    main { position:relative; z-index:1; width:min(680px,calc(100% - 36px)); padding:110px 24px 70px; text-align:center; }
    .eyebrow { display:inline-flex; align-items:center; gap:10px; color:var(--aqua); font:500 11px 'DM Mono',monospace; letter-spacing:.2em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--aqua); box-shadow:0 0 14px var(--aqua); }
    h1 { margin:22px 0 18px; font-size:clamp(54px,11vw,90px); line-height:1; letter-spacing:-.075em; font-weight:800; }
    h1 span { color:transparent; background:linear-gradient(110deg,#fff 8%,#c3b5ff 48%,#93efdf 95%); -webkit-background-clip:text; background-clip:text; }
    .copy { max-width:440px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.8; }
    .contact-card { display:flex; align-items:center; gap:17px; width:fit-content; max-width:100%; margin:34px auto 0; padding:17px 23px; border:1px solid rgba(255,255,255,.12); border-radius:18px; background:rgba(255,255,255,.045); text-align:left; }
    .icon { display:grid; place-items:center; width:44px; height:44px; flex:none; border-radius:14px; color:var(--aqua); background:rgba(154,245,226,.1); font-size:20px; }
    .contact-card small { display:block; margin-bottom:4px; color:#8d8aa6; font:10px 'DM Mono',monospace; letter-spacing:.12em; text-transform:uppercase; }
    .contact-card a { color:#f5f3ff; font-size:14px; font-weight:700; text-decoration:none; overflow-wrap:anywhere; }
    .contact-card a:hover { color:var(--aqua); }
    .note { margin-top:48px; color:#77768f; font:11px 'DM Mono',monospace; letter-spacing:.08em; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <a href="gallery.html">Gallery</a>
  </nav>
  <main>
    <div class="eyebrow">Your turn</div>
    <h1><span>Say</span> hello.</h1>
    <p class="copy">Have a thought, a question, or just want to say hi? Drop a note—we’d love to hear from you.</p>
    <div class="contact-card">
      <div class="icon" aria-hidden="true">✉</div>
      <div><small>Send a little note</small><a href="mailto:hello@example.com">hello@example.com</a></div>
    </div>
    <div class="note">THE INBOX IS OPEN</div>
  </main>
</body>
</html>
